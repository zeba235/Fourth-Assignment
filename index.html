<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Shop</title>
  <link rel="stylesheet" href="STYLE.CSS" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">Modern<span>Shop</span></div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#shop">Shop</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <header id="home" class="hero">
    <div class="hero-text">
      <h1>Welcome to the Future of Shopping</h1>
      <p>Trendy collections, affordable prices, and modern style.</p>
      <a href="#shop" class="btn">Shop Now</a>
    </div>
  </header>

 
  <section id="shop" class="shop">
    <h2>Our Trending Products</h2>
    <div class="card-container">
      <div class="card">
        <img src="image3.jpg" alt="Product 1" />
        <h3>Seveston Watch</h3>
        <p>$59.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="img2.jpg" alt="Product 2" />
        <h3>Ronin Watch</h3>
        <p>$99.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="card">
        <img src="Apple-Watch-Series-9_uaedubai-ae_1.jpg" alt="Product 3" />
        <h3>Trendy watch</h3>
        <p>$79.99</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>


  <section id="contact" class="contact">

    <div class="contact-wrapper">
 
      <form class="contact-form">
            <h2>Contact Us</h2>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Email Address" required />
        <input type="text" placeholder="Subject" />
        <textarea rows="4" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>


      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3616.5341929984197!2d67.0626834109098!3d24.981958077757852!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb340e584b891c3%3A0x29b2cbc198ba2dbd!2sAptech%20Computer%20Education%20North%20Karachi%20Center!5e0!3m2!1sen!2s!4v1761051107941!5m2!1sen!2s"
          width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>


  <footer>
    <p>© 2025 ModernShop. All Rights Reserved.</p>
  </footer>
</body>
</html>
